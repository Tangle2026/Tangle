<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TANGLE Testnet</title><style>body{margin:0;background:#050505;color:#eee;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.logo{font-size:32px;font-weight:800;letter-spacing:.18em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:24px 0}.card{border:1px solid #222;border-radius:14px;padding:18px;background:#0b0b0b}.n{font-size:26px;font-weight:700;margin-top:6px}button,input{background:#111;color:#fff;border:1px solid #333;border-radius:10px;padding:10px}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow:auto;background:#090909;border:1px solid #222;padding:14px;border-radius:12px}.muted{color:#888}.ok{color:#7fffa7}</style></head><body><main><div class="top"><div><div class="logo">TANGLE</div><div class="muted">Privacy-native Layer-1 · Testnet Alpha</div></div><button onclick="load()">Refresh</button></div><section class="grid" id="stats"></section><div class="card"><h3>Dev Faucet</h3><div class="row"><input id="addr" value="alice" placeholder="address"><button onclick="faucet()">Get 1,000 TGL</button></div><p id="msg" class="muted"></p></div><div class="card"><h3>Create Routing Vault</h3><div class="row"><input id="owner" value="alice"><input id="stake" value="1000" type="number"><button onclick="vault()">Create Vault</button></div></div><div class="card"><h3>Send TGL</h3><div class="row"><input id="from" value="alice"><input id="to" value="bob"><input id="amount" value="100000" type="number"><button onclick="send()">Submit</button></div></div><div class="card"><h3>Protocol status</h3><pre id="out">Loading…</pre></div></main><script>async function j(u,o){let r=await fetch(u,o);let t=await r.text();try{return JSON.parse(t)}catch{return {error:t}}}async function load(){let s=await j('/api/status');stats.innerHTML=Object.entries(s).map(([k,v])=>`<div class=card><div class=muted>${k}</div><div class=n>${v}</div></div>`).join('');out.textContent=JSON.stringify({status:s,blocks:await j('/api/blocks'),vaults:await j('/api/vaults')},null,2)}async function post(u,b){return j(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)})}async function faucet(){let x=await post('/api/faucet',{address:addr.value});msg.textContent=JSON.stringify(x);load()}async function vault(){let x=await post('/api/vaults',{owner:owner.value,stake:Number(stake.value)});msg.textContent=JSON.stringify(x);load()}async function send(){let x=await post('/api/transactions',{from:from.value,to:to.value,asset:'TGL',amount:Number(amount.value)});msg.textContent=JSON.stringify(x);load()}load();setInterval(load,4000)</script></body></html>
